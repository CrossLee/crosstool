name: Windows

on:
  push:
    paths:
      - "windows/**"
      - "Resources/Brand/CrosioIcon.png"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - "Resources/Brand/CrosioIcon.png"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    # Pin VS 2022 because the native extension targets MSVC v143 for both x64
    # and ARM64; the newer VS 2026 image does not include v143 ARM64 tools.
    runs-on: windows-2022
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Run Windows verification
        shell: pwsh
        run: .\windows\scripts\verify-windows.ps1 -Configuration Release -Platform x64

      - name: Upload unpackaged test build
        uses: actions/upload-artifact@v4
        with:
          name: Crosio-windows-x64-test-build
          path: windows/artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 14

      - name: Choose package version
        id: package_version
        shell: pwsh
        run: |
          $build = [Math]::Max(1, ([int64]$env:GITHUB_RUN_NUMBER % 65535))
          "version=0.1.$build.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare signing certificate
        id: signing_certificate
        if: github.event_name != 'pull_request' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "Crosio.Windows.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build unsigned x64 and ARM64 MSIX bundle
        if: steps.signing_certificate.outputs.path == ''
        shell: pwsh
        run: >-
          .\windows\scripts\build-msixbundle.ps1
          -Configuration Release
          -Version "${{ steps.package_version.outputs.version }}"

      - name: Build signed x64 and ARM64 MSIX bundle
        if: steps.signing_certificate.outputs.path != ''
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          .\windows\scripts\build-msixbundle.ps1
          -Configuration Release
          -Version "${{ steps.package_version.outputs.version }}"
          -CertificatePath "${{ steps.signing_certificate.outputs.path }}"
          -CertificatePassword $env:CERTIFICATE_PASSWORD

      - name: Upload unsigned test MSIX packages
        if: success() && steps.signing_certificate.outputs.path == ''
        uses: actions/upload-artifact@v4
        with:
          name: Crosio-windows-${{ steps.package_version.outputs.version }}-unsigned-test
          path: windows/artifacts/release/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed MSIX packages
        if: success() && steps.signing_certificate.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Crosio-windows-${{ steps.package_version.outputs.version }}-signed
          path: windows/artifacts/release/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing certificate
        if: always() && steps.signing_certificate.outputs.path != ''
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ steps.signing_certificate.outputs.path }}" -Force -ErrorAction SilentlyContinue
